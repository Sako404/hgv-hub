name: CI

# Minimal by design: install, test, build. No deployment, no publishing,
# no repository mutation, no secrets. Its job is to validate pull requests
# independently of any one contributor's machine.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build
