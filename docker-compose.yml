services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workingtime}
      POSTGRES_USER: ${POSTGRES_USER:-workingtime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workingtime}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "${SERVER_PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-workingtime}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-workingtime}
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped

  # The only service with Docker socket access -- see updater/src/index.js
  # for why, and docs/BACKEND_SELF_HOSTING.md for what REPO_HOST_PATH
  # must be set to. Deliberately no `ports:` -- reachable only from
  # `server` over this compose network, never from the host or internet.
  updater:
    build:
      context: .
      dockerfile: updater/Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${REPO_HOST_PATH:-.}:${REPO_HOST_PATH:-.}
      # TrueNAS-only, see docs/BACKEND_SELF_HOSTING.md and
      # deploy/truenas/README.md. Harmless on a generic deployment
      # (TRUENAS_SSH_HOST unset, these paths never read): /dev/null is a
      # valid, always-present bind-mount source for an unused file
      # target; the state dir default lives outside the repo, in /tmp,
      # so it never touches the git working tree either way.
      - ${TRUENAS_SSH_KEY_HOST_PATH:-/dev/null}:/updater-ssh/id_ed25519:ro
      - ${TRUENAS_SSH_KNOWN_HOSTS_HOST_PATH:-/dev/null}:/updater-ssh/known_hosts:ro
      - ${UPDATER_STATE_HOST_PATH:-/tmp/hgv-hub-updater-state-unused}:/updater-state:ro
    environment:
      REPO_HOST_PATH: ${REPO_HOST_PATH:-.}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-}
      # Presence of TRUENAS_SSH_HOST is what selects the TrueNAS
      # lifecycle-handoff path in updater/src/index.js -- leave unset for
      # a plain/generic Docker Compose deployment.
      TRUENAS_SSH_HOST: ${TRUENAS_SSH_HOST:-}
      TRUENAS_SSH_USER: ${TRUENAS_SSH_USER:-truenas_admin}
    restart: unless-stopped

volumes:
  # Explicit, stable name — NOT derived from the compose project name
  # (which COMPOSE_PROJECT_NAME above can change). Without this, adding
  # or changing that variable silently points postgres at a brand new,
  # empty volume instead of an existing deployment's real data, since
  # Docker Compose's default volume naming is
  # "<project-name>_<volume-key>". Found the hard way: switching a real
  # TrueNAS deployment onto COMPOSE_PROJECT_NAME the first time did
  # exactly this.
  pgdata:
    name: hgv-hub_pgdata
